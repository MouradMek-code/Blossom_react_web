  <ellipse cx="178" cy="170" rx="12" ry="7" fill="#ffb3ba" opacity="0.6"/>
  <!-- Left fox nose -->
  <ellipse cx="148" cy="173" rx="6" ry="4" fill="#2d2d2d"/>
  <!-- Left fox smile -->
  <path d="M 140 179 Q 148 186 156 179" stroke="#2d2d2d" stroke-width="2" fill="none"/>
