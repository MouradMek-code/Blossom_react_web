  </defs>
  <rect width="400" height="320" fill="url(#bg6)" rx="20"/>

  <!-- Stars/sparkles -->
  <text x="70" y="55" font-size="16" opacity="0.6">✨</text>
  <text x="310" y="65" font-size="14" opacity="0.5">✨</text>
  <text x="180" y="35" font-size="12" opacity="0.4">⭐</text>
