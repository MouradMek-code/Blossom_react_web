  <!-- Right fox paws -->
  <ellipse cx="222" cy="280" rx="20" ry="12" fill="#c0392b"/>
  <ellipse cx="282" cy="280" rx="20" ry="12" fill="#c0392b"/>

  <!-- Nuzzling -->
  <ellipse cx="200" cy="172" rx="14" ry="8" fill="#ffb3ba" opacity="0.35"/>

  <text x="200" y="314" font-size="13" text-anchor="middle" fill="#e07b39" font-family="Arial" font-weight="bold">Foxy love 🦊💛</text>
